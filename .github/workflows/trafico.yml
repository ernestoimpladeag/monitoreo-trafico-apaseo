name: Monitoreo de Trafico Apaseo

on:
  schedule:
    # Lunes a Viernes (días 1-5): Bloques matutino, vespertino y nocturno cada 20 mins
    - cron: '40-59/20 6 * * 1-5'
    - cron: '0-20/20 7 * * 1-5'
    - cron: '40-59/20 12 * * 1-5'
    - cron: '0-40/20 13 * * 1-5'
    - cron: '20-59/20 18 * * 1-5'
    - cron: '0-20/20 19 * * 1-5'
    
    # Sábado y Domingo (días 0 y 6): De 11:00 a 15:20 cada 20 mins
    - cron: '0-59/20 11-15 * * 0,6'

  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras probarlo

jobs:
  run-traffic-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests gspread google-auth

      - name: Ejecutar script de medición
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python medir_trafico.py
